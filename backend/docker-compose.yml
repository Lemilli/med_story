services:
  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-unsafe-dev-secret-key-change-me-32chars}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://medstory:medstory@db:5432/medstory}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
      AI_OCR_PROVIDER: ${AI_OCR_PROVIDER:-mock}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-mock}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-5.1-mini}
      AI_OPENAI_OCR_MODEL: ${AI_OPENAI_OCR_MODEL:-gpt-5.1-mini}
      AI_OPENAI_TIMEOUT_SECONDS: ${AI_OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-unsafe-dev-secret-key-change-me-32chars}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://medstory:medstory@db:5432/medstory}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-mock}
      AI_OCR_PROVIDER: ${AI_OCR_PROVIDER:-mock}
      AI_STT_PROVIDER: ${AI_STT_PROVIDER:-mock}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_OPENAI_MODEL: ${AI_OPENAI_MODEL:-gpt-5.1-mini}
      AI_OPENAI_OCR_MODEL: ${AI_OPENAI_OCR_MODEL:-gpt-5.1-mini}
      AI_OPENAI_TIMEOUT_SECONDS: ${AI_OPENAI_TIMEOUT_SECONDS:-60}
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medstory
      POSTGRES_USER: medstory
      POSTGRES_PASSWORD: medstory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
