x-app-environment: &app_environment
  DEBUG: "${DEBUG:?DEBUG is required}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}"
  ENABLE_ADMIN: "${ENABLE_ADMIN:-False}"
  ENABLE_API_DOCS: "${ENABLE_API_DOCS:-False}"
  PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}"
  PRIVACY_NOTICE_VERSION: "${PRIVACY_NOTICE_VERSION:?PRIVACY_NOTICE_VERSION is required}"
  EMAIL_BACKEND: "${EMAIL_BACKEND:?EMAIL_BACKEND is required}"
  EMAIL_HOST: "${EMAIL_HOST:-}"
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}"
  EMAIL_CHALLENGE_TTL_SECONDS: "${EMAIL_CHALLENGE_TTL_SECONDS:-900}"
  EMAIL_CHALLENGE_MAX_ATTEMPTS: "${EMAIL_CHALLENGE_MAX_ATTEMPTS:-5}"
  DEMO_MAX_VERIFIED_USERS: "${DEMO_MAX_VERIFIED_USERS:-100}"
  REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-False}"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  CELERY_BROKER_URL: "${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}"
  CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}"
  THROTTLE_CACHE_URL: "${THROTTLE_CACHE_URL:?THROTTLE_CACHE_URL is required}"
  THROTTLE_TRUSTED_PROXY_COUNT: "${THROTTLE_TRUSTED_PROXY_COUNT:-1}"
  AI_LLM_PROVIDER: "${AI_LLM_PROVIDER:-mock}"
  AI_OCR_PROVIDER: "${AI_OCR_PROVIDER:-mock}"
  AI_STT_PROVIDER: "${AI_STT_PROVIDER:-mock}"
  AI_OPENAI_MODEL: "${AI_OPENAI_MODEL:-gpt-5.4-nano}"
  AI_OPENAI_SUMMARY_MODEL: "${AI_OPENAI_SUMMARY_MODEL:-gpt-5.4-mini}"
  AI_OPENAI_OCR_MODEL: "${AI_OPENAI_OCR_MODEL:-gpt-5.4-nano}"
  AI_OPENAI_STT_MODEL: "${AI_OPENAI_STT_MODEL:-gpt-4o-mini-transcribe}"
  AI_OPENAI_TIMEOUT_SECONDS: "${AI_OPENAI_TIMEOUT_SECONDS:-60}"
  AI_ENABLED: "${AI_ENABLED:-True}"
  AI_USER_DAILY_UNITS: "${AI_USER_DAILY_UNITS:-10}"
  AI_GLOBAL_DAILY_UNITS: "${AI_GLOBAL_DAILY_UNITS:-20}"
  AI_GLOBAL_MONTHLY_UNITS: "${AI_GLOBAL_MONTHLY_UNITS:-150}"
  ORIGINAL_STORAGE_BACKEND: "${ORIGINAL_STORAGE_BACKEND:-s3}"
  ORIGINAL_STORAGE_REQUIRE_S3: "${ORIGINAL_STORAGE_REQUIRE_S3:-True}"
  ORIGINAL_STORAGE_ENDPOINT: "${ORIGINAL_STORAGE_ENDPOINT:-https://garage-proxy}"
  ORIGINAL_STORAGE_REGION: "${ORIGINAL_STORAGE_REGION:-medstory}"
  ORIGINAL_STORAGE_BUCKET: "${ORIGINAL_STORAGE_BUCKET:-medstory-originals}"
  ORIGINAL_STORAGE_VERIFY_TLS: "${ORIGINAL_STORAGE_VERIFY_TLS:-True}"
  ORIGINAL_MASTER_KEY_VERSION: "${ORIGINAL_MASTER_KEY_VERSION:-1}"
  ORIGINAL_STRICT_FILE_VALIDATION: "${ORIGINAL_STRICT_FILE_VALIDATION:-True}"
  ORIGINAL_MALWARE_SCANNER: "${ORIGINAL_MALWARE_SCANNER:-clamav}"
  ORIGINAL_STORAGE_QUOTA_BYTES: "${ORIGINAL_STORAGE_QUOTA_BYTES:-104857600}"
  CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"

services:
  api:
    build: .
    command: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --timeout 120
      --graceful-timeout 30
      --keep-alive 5
      --max-requests 500
      --max-requests-jitter 50
      --worker-tmp-dir /dev/shm
      --error-logfile -
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    logging: &service_logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      <<: *app_environment
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      AI_OPENAI_API_KEY: "${AI_OPENAI_API_KEY:-}"
      ORIGINAL_STORAGE_SERVICE_ROLE: api
      ORIGINAL_STORAGE_UPLOAD_ACCESS_KEY_FILE: /run/secrets/garage_upload_access_key
      ORIGINAL_STORAGE_UPLOAD_SECRET_KEY_FILE: /run/secrets/garage_upload_secret_key
      ORIGINAL_STORAGE_READ_ACCESS_KEY_FILE: /run/secrets/garage_read_access_key
      ORIGINAL_STORAGE_READ_SECRET_KEY_FILE: /run/secrets/garage_read_secret_key
      ORIGINAL_STORAGE_DELETION_ACCESS_KEY_FILE: /run/secrets/garage_deletion_access_key
      ORIGINAL_STORAGE_DELETION_SECRET_KEY_FILE: /run/secrets/garage_deletion_secret_key
      ORIGINAL_MASTER_KEY_FILE: /run/secrets/original_master_key
      ORIGINAL_STORAGE_CA_BUNDLE: /run/secrets/storage_ca_certificate
      FILE_UPLOAD_TEMP_DIR: /var/run/medstory-uploads
    tmpfs:
      - /var/run/medstory-uploads:size=268435456,mode=0700,uid=10001,gid=10001
      - /tmp:size=67108864,mode=1777
    secrets:
      - original_master_key
      - garage_upload_access_key
      - garage_upload_secret_key
      - garage_read_access_key
      - garage_read_secret_key
      - garage_deletion_access_key
      - garage_deletion_secret_key
      - storage_ca_certificate
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-proxy:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - default
      - storage_internal

  worker:
    build: .
    command: >-
      celery -A config worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      --max-tasks-per-child=50
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: 1.5
    pids_limit: 128
    logging: *service_logging
    environment:
      <<: *app_environment
      AI_OPENAI_API_KEY: "${AI_OPENAI_API_KEY:-}"
      ORIGINAL_STORAGE_SERVICE_ROLE: worker
      ORIGINAL_STORAGE_PROCESSING_ACCESS_KEY_FILE: /run/secrets/garage_processing_access_key
      ORIGINAL_STORAGE_PROCESSING_SECRET_KEY_FILE: /run/secrets/garage_processing_secret_key
      ORIGINAL_STORAGE_DELETION_ACCESS_KEY_FILE: /run/secrets/garage_deletion_access_key
      ORIGINAL_STORAGE_DELETION_SECRET_KEY_FILE: /run/secrets/garage_deletion_secret_key
      ORIGINAL_MASTER_KEY_FILE: /run/secrets/original_master_key
      ORIGINAL_STORAGE_CA_BUNDLE: /run/secrets/storage_ca_certificate
      FILE_UPLOAD_TEMP_DIR: /var/run/medstory-uploads
    tmpfs:
      - /var/run/medstory-uploads:size=268435456,mode=0700,uid=10001,gid=10001
      - /tmp:size=67108864,mode=1777
    secrets:
      - original_master_key
      - garage_processing_access_key
      - garage_processing_secret_key
      - garage_deletion_access_key
      - garage_deletion_secret_key
      - storage_ca_certificate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage-proxy:
        condition: service_healthy
      clamav:
        condition: service_started
    networks:
      - default
      - storage_internal

  beat:
    build: .
    command: >-
      celery -A config beat
      --loglevel=info
      --schedule=/var/run/celery/celerybeat-schedule
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 64
    logging: *service_logging
    environment:
      <<: *app_environment
    tmpfs:
      - /var/run/celery:size=16777216,mode=0700,uid=10001,gid=10001
      - /tmp:size=33554432,mode=1777
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: python manage.py migrate --noinput --skip-checks
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    logging: *service_logging
    environment:
      <<: *app_environment
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}"
    tmpfs:
      - /tmp:size=67108864,mode=1777
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - operations

  garage:
    build:
      context: .
      dockerfile: Dockerfile.garage
    image: medstory-garage:2.3.0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging: *service_logging
    volumes:
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
      - ./garage-entrypoint.sh:/garage-entrypoint.sh:ro
    environment:
      GARAGE_METADATA_DIR: /var/lib/garage/meta
      GARAGE_DATA_DIR: /var/lib/garage/data
      GARAGE_DB_ENGINE: lmdb
      GARAGE_REPLICATION_FACTOR: 1
      GARAGE_RPC_BIND_ADDR: 0.0.0.0:3901
      GARAGE_S3_API_BIND_ADDR: 0.0.0.0:3900
      GARAGE_S3_API_S3_REGION: medstory
      GARAGE_ADMIN_API_BIND_ADDR: 0.0.0.0:3903
      ORIGINAL_STORAGE_BUCKET: medstory-originals
    secrets:
      - garage_rpc_secret
      - garage_admin_token
      - garage_bootstrap_access_key
      - garage_bootstrap_secret_key
      - garage_upload_access_key
      - garage_upload_secret_key
      - garage_read_access_key
      - garage_read_secret_key
      - garage_processing_access_key
      - garage_processing_secret_key
      - garage_deletion_access_key
      - garage_deletion_secret_key
    networks:
      - storage_internal

  garage-proxy:
    image: nginx:1.29.8-alpine3.23
    restart: unless-stopped
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *service_logging
    tmpfs:
      - /var/cache/nginx:size=16777216,mode=0750,uid=101,gid=101
      - /var/run:size=16777216,mode=0750,uid=101,gid=101
      - /tmp:size=16777216,mode=1777,uid=101,gid=101
    volumes:
      - ./garage-proxy.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - storage_tls_certificate
      - storage_tls_private_key
    depends_on:
      - garage
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider --no-check-certificate https://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storage_internal

  clamav:
    image: clamav/clamav-debian:1.5.3_base
    restart: unless-stopped
    init: true
    mem_limit: 3g
    cpus: 1.5
    pids_limit: 256
    logging: *service_logging
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks:
      - default
      - storage_internal

  db:
    image: postgres:16.14-trixie
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    logging: *service_logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medstory}
      POSTGRES_USER: medstory_admin
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD is required}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-medstory-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.10-alpine3.21
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *service_logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  garage_data:
  garage_meta:
  clamav_signatures:

secrets:
  original_master_key:
    file: ./secrets/original_master_key
  garage_rpc_secret:
    file: ./secrets/garage_rpc_secret
  garage_admin_token:
    file: ./secrets/garage_admin_token
  garage_bootstrap_access_key:
    file: ./secrets/garage_bootstrap_access_key
  garage_bootstrap_secret_key:
    file: ./secrets/garage_bootstrap_secret_key
  garage_upload_access_key:
    file: ./secrets/garage_upload_access_key
  garage_upload_secret_key:
    file: ./secrets/garage_upload_secret_key
  garage_read_access_key:
    file: ./secrets/garage_read_access_key
  garage_read_secret_key:
    file: ./secrets/garage_read_secret_key
  garage_processing_access_key:
    file: ./secrets/garage_processing_access_key
  garage_processing_secret_key:
    file: ./secrets/garage_processing_secret_key
  garage_deletion_access_key:
    file: ./secrets/garage_deletion_access_key
  garage_deletion_secret_key:
    file: ./secrets/garage_deletion_secret_key
  storage_ca_certificate:
    file: ./secrets/storage_ca_certificate.pem
  storage_tls_certificate:
    file: ./secrets/storage_tls_certificate.pem
  storage_tls_private_key:
    file: ./secrets/storage_tls_private_key.pem

networks:
  storage_internal:
    internal: true
