name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-deterministic-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DATABASE_URL: "sqlite:////tmp/medstory-ci.sqlite3"
      AI_LLM_PROVIDER: "mock"
      AI_OCR_PROVIDER: "mock"
      AI_STT_PROVIDER: "mock"
      ORIGINAL_STORAGE_BACKEND: "memory"
      ORIGINAL_STORAGE_REQUIRE_S3: "False"
      ORIGINAL_MALWARE_SCANNER: "mock"
      CELERY_BROKER_URL: "memory://"
      CELERY_RESULT_BACKEND: "cache+memory://"
      CELERY_TASK_ALWAYS_EAGER: "True"
      EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'

      - name: Install dependencies
        run: pip install --requirement requirements.txt

      - name: Check Django project
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Build backend image
        run: docker build -t medstory-backend:test .

      - name: Verify hardened image contents and user
        run: >-
          docker run --rm medstory-backend:test sh -c
          'test "$(id -u)" = 10001 &&
          test ! -e /app/.env &&
          test ! -e /app/.env.production &&
          test ! -e /app/secrets'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android debug
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8000/api/v1

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'

      - name: Audit Python dependencies
        run: >-
          python -m pip install pip-audit==2.10.1 &&
          pip-audit --requirement backend/requirements.txt --no-deps --disable-pip

      - name: Scan Python and Flutter dependency manifests
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            scan source .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
