name: Production Compose smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/production-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/production-smoke.yml"
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Eight-service production stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate smoke scripts
        run: |
          bash -n backend/deploy/ovh/production-smoke.sh
          python3 -m py_compile backend/deploy/ovh/production_smoke_checks.py

      - name: Run isolated production Compose smoke test
        run: backend/deploy/ovh/production-smoke.sh
